<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotografía — Portfolio</title>

    <link rel="stylesheet" href="fotografia.css">

</head>


<body>


    <header class="photo-header">

        <a href="index.html" class="back">
            ← INICIO
        </a>


        <div class="header-title">

            <span>01</span>

            <strong>FOTOGRAFÍA</strong>

        </div>


        <div class="counter">

            <span id="current">01</span>

            <span>/</span>

            <span id="total">01</span>

        </div>

    </header>



    <main class="gallery">


        <!-- =====================================
             PROYECTO 01
        ====================================== -->

        <article class="project active">


            <div class="photo-series">


                <div class="photo">

                    <img
                        src="fotografia/IMG_000152.jpg"
                        alt="Fotografía del proyecto"
                    >

                </div>
                
                <div class="photo">

                    <img
                        src="fotografia/IMG_000026.jpg"
                        alt="Fotografía del proyecto"
                    >

                </div>


                <div class="photo">

                    <img
                        src="fotografia/IMG_000052.jpg"
                        alt="Fotografía del proyecto"
                    >

                </div>


            </div>



            <div class="project-info">


                <div class="project-number">
                    01
                </div>


                <div class="project-text">


                    <p>María Escoté MBFW 2018</p>

                </div>


            </div>


        </article>



        <!-- =====================================
             AQUÍ AÑADIREMOS LOS SIGUIENTES
             PROYECTOS FOTOGRÁFICOS
        ====================================== -->


        <button
            class="navigation previous"
            id="previous"
            aria-label="Proyecto anterior">
            ←
        </button>


        <button
            class="navigation next"
            id="next"
            aria-label="Proyecto siguiente">
            →
        </button>


    </main>



    <footer>

        <span>PORTFOLIO AUDIOVISUAL</span>

    </footer>



    <script src="fotografia.js"></script>

</body>

</html>
