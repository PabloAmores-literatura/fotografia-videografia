<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videografía — Portfolio</title>

    <link rel="stylesheet" href="videografia.css">
</head>

<body>

    <!-- NAVEGACIÓN SUPERIOR -->

    <header class="video-header">

        <a href="index.html" class="back">
            ← INICIO
        </a>

        <div class="header-title">
            <span>02</span>
            <strong>VIDEOGRAFÍA</strong>
        </div>

        <div class="counter">
            <span id="current">01</span>
            <span>/</span>
            <span id="total">02</span>
        </div>

    </header>


    <!-- GALERÍA -->

    <main class="gallery">


        <!-- PROYECTO 01 -->

        <article class="project active">

            <div class="video-frame">

                <iframe
                    src="https://www.youtube.com/embed/lVWSQMh-Lsc?rel=0"
                    title="Hazte Así"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="project-info">

                <div class="project-number">
                    01
                </div>

                <div class="project-text">

                    <h1>joseluis - Hazte Así</h1>

                    <p>Videoclip</p>

                </div>

            </div>

        </article>


        <!-- PROYECTO 02 -->

        <article class="project">

            <div class="video-frame">

                <iframe
                    src="https://www.youtube.com/embed/dudeT77_tFE?rel=0"
                    title="El Orden De Las Cosas"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="project-info">

                <div class="project-number">
                    02
                </div>

                <div class="project-text">

                    <h1>Mondo du Plantis - El Orden De Las Cosas</h1>

                    <p>Videoclip</p>

                </div>

            </div>

        </article>


        <!-- FLECHAS -->

        <button class="navigation previous" id="previous" aria-label="Proyecto anterior">
            ←
        </button>

        <button class="navigation next" id="next" aria-label="Proyecto siguiente">
            →
        </button>

    </main>


    <!-- PIE -->

    <footer>

        <span>PORTFOLIO AUDIOVISUAL</span>

    </footer>


    <script src="videografia.js"></script>

</body>
</html>
